name: Release Gateway

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true
        type: string
      enclave_environment:
        description: "Environment label compiled into the enclave artifact name"
        required: true
        default: "prod"
        type: string

permissions:
  id-token: write
  contents: write

concurrency:
  group: release-gateway
  cancel-in-progress: false

jobs:
  push-image:
    name: Build and push nexus-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_NAME: nexus-gateway
      VERSION: ${{ inputs.version }}
      RELEASE_ENVIRONMENT: ${{ inputs.enclave_environment }}
      ENCLAVE_KMS_KEY_ARN: ${{ vars.ENCLAVE_KMS_KEY_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate release inputs
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release workflow must run from main, got: $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v1.2.3, got: $VERSION"
            exit 1
          fi
          if [[ ! "$RELEASE_ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]]; then
            echo "invalid enclave environment: $RELEASE_ENVIRONMENT"
            exit 1
          fi
          if [[ ! "$ENCLAVE_KMS_KEY_ARN" =~ ^arn:(aws|aws-us-gov|aws-cn):kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-fA-F-]{36}$ ]]; then
            echo "repository variable ENCLAVE_KMS_KEY_ARN must contain the full enclave secret-release KMS key ARN"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "release tag already exists: $VERSION"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build gateway image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/dappnode/dappnode-nexus-gateway \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:$VERSION" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:latest" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:sha-${{ github.sha }}" \
            -f apps/gateway/Dockerfile \
            .

      - name: Push immutable gateway image tags
        run: |
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$VERSION"
          docker push "$ECR_REGISTRY/$IMAGE_NAME:sha-${{ github.sha }}"

      - name: Resolve gateway image digest
        id: normal-image
        run: |
          image_digest="$(aws ecr describe-images \
            --repository-name "$IMAGE_NAME" \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "failed to resolve ECR image digest: $image_digest"
            exit 1
          fi
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$ECR_REGISTRY/$IMAGE_NAME@$image_digest"

      - name: Build EIF and release metadata
        id: enclave
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KMS_KEY_ARN: ${{ env.ENCLAVE_KMS_KEY_ARN }}
          NORMAL_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          NORMAL_IMAGE_DIGEST: ${{ steps.normal-image.outputs.digest }}
          ARTIFACT_DIR: release-artifacts
        run: deploy/nitro/build-release-assets.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify release manifest
        env:
          MANIFEST_PATH: ${{ steps.enclave.outputs.manifest_path }}
        run: |
          bundle_path="${MANIFEST_PATH}.sigstore.json"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-and-push.yml@refs/heads/main"
          cosign sign-blob \
            --yes \
            --bundle "$bundle_path" \
            "$MANIFEST_PATH"
          cosign verify-blob \
            --bundle "$bundle_path" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$MANIFEST_PATH"

      - name: Publish latest gateway image tag
        run: docker push "$ECR_REGISTRY/$IMAGE_NAME:latest"

      # Swaps the ambient AWS credentials, so it comes after every ECR step.
      # The allowlist role is scoped to this repository on main and to the two
      # key-policy actions on the secret-release key; it deliberately holds no
      # kms:Decrypt, so it can change which enclaves may decrypt but can never
      # read a secret itself.
      - name: Configure AWS credentials for the measurement allowlist
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_KMS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Additive and idempotent. The allowlist gates kms:Decrypt on PCR0, so an
      # absent measurement means an enclave cannot decrypt its secrets -- adding
      # one grants nothing beyond the release just built. Pruning old
      # measurements is deliberately NOT done here: it is what turns a rollback
      # into an outage, so it stays a manual step once the new release is known
      # good.
      - name: Allow the new measurement to decrypt Gateway secrets
        env:
          KMS_KEY_ARN: ${{ env.ENCLAVE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PCR0: ${{ steps.enclave.outputs.pcr0 }}
        run: ./deploy/nitro/kms-allowlist.sh add "$PCR0"

      - name: Write release summary
        env:
          NORMAL_IMAGE_DIGEST: ${{ steps.normal-image.outputs.digest }}
          ASSET_PREFIX: ${{ steps.enclave.outputs.asset_prefix }}
          MANIFEST_NAME: ${{ steps.enclave.outputs.manifest_name }}
          PCR0: ${{ steps.enclave.outputs.pcr0 }}
          PCR1: ${{ steps.enclave.outputs.pcr1 }}
          PCR2: ${{ steps.enclave.outputs.pcr2 }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          summary_path="$RUNNER_TEMP/release-body.md"
          {
            echo "Normal image: \`$ECR_REGISTRY/$IMAGE_NAME:$VERSION@$NORMAL_IMAGE_DIGEST\`"
            echo
            echo "Enclave artifact: \`${ASSET_PREFIX}.eif\`"
            echo
            echo "PCR0: \`$PCR0\`"
            echo
            echo "PCR1: \`$PCR1\`"
            echo
            echo "PCR2: \`$PCR2\`"
            echo
            echo "The signed release manifest records the source commit, build inputs, measurements, and attested EHBP body-encryption profile. TLS still terminates outside the enclave, so HTTP metadata and the bearer API key remain visible."
            echo
            echo "### Verify this release"
            echo
            echo "1. Confirm these measurements were published by this workflow running on \`main\`:"
            echo
            echo '```bash'
            echo "cosign verify-blob \\"
            echo "  --bundle ${MANIFEST_NAME}.sigstore.json \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-and-push.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${MANIFEST_NAME}"
            echo '```'
            echo
            echo "2. Rebuild this revision and confirm it produces the same measurements. This needs no AWS account, no credentials and no Nitro hardware:"
            echo
            echo '```bash'
            echo "git checkout ${GITHUB_SHA}"
            echo "./deploy/nitro/verify-build.sh ${MANIFEST_NAME}"
            echo '```'
            echo
            echo "3. Ask the running Gateway for a nonce-bound attestation and check it against these measurements with \`nexus-attestation-verify\`."
            echo
            echo "The \`.eif\` asset is the deployment artifact; its \`.sha256\` only confirms a download arrived intact. It is deliberately not reproducible: nitro-cli stamps the build time into an EIF metadata section that PCR0 excludes by design, so two honest builds of the same source yield identical measurements but different EIF checksums. Compare measurements, never EIF hashes."
          } > "$summary_path"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gateway ${{ inputs.version }}
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-body.md
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release-artifacts/*
